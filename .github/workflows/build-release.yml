name: Build and release

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - id: info
        run: node scripts/release-info.mjs

  build:
    needs: version
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test and compile
        run: npm test
      - name: Package application
        run: node scripts/package.mjs "$PLATFORM" "$ARCH"
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
      - name: Apply and verify local Mac development signature
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "release/Animo-darwin-$ARCH/Animo.app"
          codesign --verify --deep --strict "release/Animo-darwin-$ARCH/Animo.app"
        env:
          ARCH: ${{ matrix.arch }}
      - name: Verify packaged runtime
        run: node scripts/verify-package.mjs
      - name: Create download archive and checksum
        run: node scripts/create-distribution.mjs
      - name: Upload downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: download-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/Animo-${{ needs.version.outputs.version }}-*.zip
            release/Animo-${{ needs.version.outputs.version }}-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/ci-verification/
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: download-*
          path: artifacts/release-assets
          merge-multiple: true
      - name: Verify all downloads and publish release
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
